[package]
name = "ita25_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
json5 = "1.3.1"
poise = "0.7.0"
reqwest = { version = "0.13.5", features = ["query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
